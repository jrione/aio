# Konfigurasi penyajian SPA hasil `npm run build`.
#
# Isinya empat aturan, dan masing-masing menjawab masalah yang berbeda.
# Salah satu saja terlewat, gejalanya muncul di tempat yang jauh dari sebabnya.

server {
  listen       8080;
  server_name  _;
  root         /usr/share/nginx/html;

  # Kompresi. Berkas terbesar di aplikasi ini menyusut dari 356 kB jadi 100 kB.
  gzip              on;
  gzip_vary         on;
  gzip_min_length   1024;
  gzip_proxied      any;
  gzip_types        text/plain text/css application/javascript application/json
                    image/svg+xml application/manifest+json;

  # ────────────────────────────────────────────────────────────
  # 0. `/api/` tidak boleh kena fallback
  #
  # Default `VITE_API_BASE_URL` adalah `/api`. Kalau blok ini tidak ada,
  # aturan fallback di bawah membalas `index.html` untuk setiap panggilan API
  # yang tidak terproxy — dengan status 200. Aplikasi lalu mencoba mem-parse
  # HTML sebagai JSON dan menampilkan "Respons server tidak dapat dibaca",
  # pesan yang menyalahkan backend padahal backendnya tidak pernah dihubungi.
  #
  # 404 jauh lebih jujur. Kalau API memang berada di belakang nginx yang sama,
  # ganti blok ini dengan proxy:
  #
  #   location /api/ {
  #     proxy_pass       http://backend:3000/;
  #     proxy_set_header Host              $host;
  #     proxy_set_header X-Forwarded-For   $proxy_add_x_forwarded_for;
  #     proxy_set_header X-Forwarded-Proto $scheme;
  #   }
  # ────────────────────────────────────────────────────────────
  location /api/ {
    include /etc/nginx/conf.d/security-headers.conf;
    return 404;
  }

  # ────────────────────────────────────────────────────────────
  # 1. Aset ber-hash: cache selamanya, dan JANGAN di-fallback
  #
  # Nama berkasnya mengandung hash isi (`index-C7FzeKaG.js`), jadi isi yang
  # berubah selalu menghasilkan nama baru — aman di-cache setahun.
  #
  # `try_files ... =404` di sini yang paling penting, dan yang paling sering
  # terlupa. Tanpa blok ini, aturan fallback di bawah berlaku juga untuk
  # `/assets/`, sehingga chunk yang sudah tidak ada dibalas `index.html`
  # dengan status **200**. Browser lalu mencoba mengurai HTML sebagai
  # JavaScript dan melempar "Unexpected token '<'" — pesan yang tidak
  # menyebut-nyebut konfigurasi server sama sekali, di berkas yang tidak
  # pernah ditulis siapa pun.
  #
  # Dengan `=404` yang sejujurnya, aplikasi menangkapnya sebagai kegagalan
  # memuat chunk dan menawarkan "muat ulang halaman" — lihat
  # `src/components/CrashFallback.tsx`.
  # ────────────────────────────────────────────────────────────
  location /assets/ {
    include /etc/nginx/conf.d/security-headers.conf;
    try_files $uri =404;
    add_header Cache-Control "public, max-age=31536000, immutable" always;
  }

  # ────────────────────────────────────────────────────────────
  # 2. index.html: tidak boleh di-cache
  #
  # Ia satu-satunya berkas yang namanya tidak ber-hash, dan isinya menunjuk
  # nama-nama chunk yang berganti tiap deploy. index.html basi berarti browser
  # meminta chunk yang sudah dihapus — persis kegagalan yang ditangani
  # `isChunkLoadError`, tapi terjadi terus-menerus sampai cache-nya kedaluwarsa.
  # ────────────────────────────────────────────────────────────
  location = /index.html {
    include /etc/nginx/conf.d/security-headers.conf;
    add_header Cache-Control "no-cache, must-revalidate" always;
  }

  # ────────────────────────────────────────────────────────────
  # 3. Fallback SPA — inti Issue #17
  #
  # Route seperti `/settings` dan `/deployments/dep-004` hanya ada di dalam
  # React Router; di disk tidak ada direktori bernama itu. Tanpa baris ini,
  # menekan F5 di halaman mana pun selain `/` menghasilkan 404 dari nginx —
  # aplikasinya tidak pernah sempat berjalan untuk menjelaskan dirinya.
  #
  # Statusnya tetap 200 dan itu memang benar: URL-nya sah, yang menentukan
  # isinya adalah router di sisi klien. Halaman 404 sungguhan dirender
  # aplikasi sendiri lewat route `*`.
  # ────────────────────────────────────────────────────────────
  location / {
    include /etc/nginx/conf.d/security-headers.conf;
    try_files $uri $uri/ /index.html;
  }
}
