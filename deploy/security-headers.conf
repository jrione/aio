# Header keamanan dasar.
#
# Tinggal di berkas terpisah, dan itu bukan kerapian belaka — itu perbaikan
# untuk bug yang benar-benar terjadi saat konfigurasi ini diuji.
#
# `add_header` di nginx **tidak diwariskan** ke sebuah `location` yang punya
# `add_header` sendiri. Ketiga header di bawah semula ditulis sekali di tingkat
# `server`, dan hasilnya: mereka hilang pada setiap balasan yang melewati
# `location = /index.html` dan `location /assets/`, karena kedua blok itu
# memasang `Cache-Control` sendiri. Yang tersisa cuma header keamanan pada
# balasan yang tidak menyentuh keduanya — yaitu hampir tidak ada.
#
# Gejalanya nol: tidak ada yang gagal, tidak ada yang lambat, dan konfigurasinya
# terbaca benar. Ia hanya diam-diam tidak berlaku.
#
# Dengan `include`, setiap `location` menyatakan sendiri bahwa ia memakai
# header ini, dan blok baru yang lupa menyertakannya terlihat saat dibaca.
add_header X-Content-Type-Options "nosniff" always;
add_header X-Frame-Options "DENY" always;
add_header Referrer-Policy "same-origin" always;
